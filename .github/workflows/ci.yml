name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python: "3.8"
          - os: ubuntu-latest
            python: "3.12"
          # The macOS arm64 runners may not provide Python 3.8, so macOS starts at 3.10.
          - os: macos-latest
            python: "3.10"
          - os: macos-latest
            python: "3.12"
          # Windows only runs tests/test_windows.py; the other test files assume a POSIX shell.
          - os: windows-latest
            python: "3.8"
          - os: windows-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install lint tools
        run: python -m pip install pyflakes
      - name: Lint
        run: python -m pyflakes src tests
      - name: README links
        # README.md is also the PyPI project page, where relative links 404: allow only full URLs and in-page anchors.
        run: |
          if grep -noE '\]\([^)]+\)' README.md | grep -vE '\]\((https?://|#)'; then
            echo 'README.md has relative links; use https://github.com/jakoes-wu/multi-codex/blob/main/... instead'; exit 1
          fi
      # zsh 与 fish 用于检查生成的补全脚本语法；没装时对应用例会跳过。
      - name: Install shellcheck, zsh and fish (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y shellcheck lsof zsh fish
      # Real node.exe for the argument pass-through test (codex.js prints what it received).
      - uses: actions/setup-node@v4
        if: runner.os == 'Windows'
        with:
          node-version: "20"
      - name: Test
        if: runner.os != 'Windows'
        run: python -m unittest discover -s tests -t tests -v
      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -t tests -p test_windows.py -v
