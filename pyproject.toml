[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-codex"
dynamic = ["version"]
description = "Run several Codex CLI accounts side by side: separate CODEX_HOME directories, launchers and proxies."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
]

[project.scripts]
multi-codex = "multi_codex.cli:main"

[project.urls]
Homepage = "https://github.com/jakoes-wu/multi-codex"

[tool.setuptools.dynamic]
version = {attr = "multi_codex.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
